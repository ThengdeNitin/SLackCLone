# Application services. Always used together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
#
# Compose merges the two files, so the network and the infrastructure health conditions
# referenced here come from the other file. Split so that rebuilding a service never
# restarts a database.

networks:
  slack-net:
    name: slack-net
    external: true      # created by docker-compose.yml; declared external so this file doesn't try to make a second one

services:

  # --- auth-service: accounts, sessions, profiles ---
  auth-service:
    build:
      # Context is backend/, not backend/auth-service/, because the build needs the parent
      # pom and common-lib. The Dockerfile paths are relative to this context.
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: slackclone/auth-service:1.0.0
    container_name: slack-auth
    restart: unless-stopped
    depends_on:
      # service_healthy, not just service_started. Flyway runs during startup and fails hard
      # if Postgres isn't accepting connections yet, and a failed migration means the app
      # exits rather than retrying - so without this the service crash-loops on every cold
      # start of the stack.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Added when this service started publishing user lifecycle events. service_healthy
      # rather than service_started: the producer factory is built at startup and an
      # unreachable broker there means the first publish blocks for max.block.ms instead of
      # failing fast.
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # Passed through from .env rather than hard-coded, so one file holds the credentials.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      AUTH_SERVICE_PORT: 8081
      TZ: ${TZ}
    ports:
      # Published mainly so Swagger UI is reachable during development. In production only
      # the gateway is exposed and this port stays inside the cluster.
      - "${AUTH_SERVICE_PORT}:8081"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          # The JVM reads this limit and sizes its heap from it (MaxRAMPercentage in the
          # Dockerfile), so this number is what actually controls memory use.
          memory: 512M
    # Give the JVM a moment to finish in-flight requests on `docker compose down`. Must
    # exceed spring.lifecycle.timeout-per-shutdown-phase (20s) or the container is killed
    # while still draining.
    stop_grace_period: 30s

  # --- workspace-service: workspaces, channels, membership, invitations ---
  workspace-service:
    build:
      context: ./backend
      dockerfile: workspace-service/Dockerfile
    image: slackclone/workspace-service:1.0.0
    container_name: slack-workspace
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Kafka is a hard start dependency because the outbox poller and the @KafkaListener both
      # connect at startup. The service would survive without it - events just queue in the
      # outbox - but failing fast on a cold start is clearer than a wall of connection retries.
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      # Must match auth-service exactly, or tokens it issues fail verification here. A
      # mismatch shows up as every request returning 401 with a valid-looking token, which is
      # a memorably confusing hour.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      WORKSPACE_SERVICE_PORT: 8082
      TZ: ${TZ}
    ports:
      - "${WORKSPACE_SERVICE_PORT}:8082"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 30s

  # --- message-service: messages, threads, reactions, pins ---
  message-service:
    build:
      context: ./backend
      dockerfile: message-service/Dockerfile
    image: slackclone/message-service:1.0.0
    container_name: slack-message
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # NOT service_healthy on workspace-service, deliberately. It is a runtime dependency
      # (every read and write asks it for authorisation) but not a startup one: this service
      # boots fine without it and returns 503 for requests it cannot authorise. Making it a
      # hard start dependency would chain the two services' startups together, so a slow
      # workspace-service deploy would take this one down as well.
      workspace-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      # Must match the other services exactly, or tokens they issue fail verification here.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      MESSAGE_SERVICE_PORT: 8083
      TZ: ${TZ}
    ports:
      - "${MESSAGE_SERVICE_PORT}:8083"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 30s

  # --- realtime-service: WebSocket delivery, presence, typing ---
  #
  # The only stateful service: its state is the set of open sockets. That changes how it scales
  # (on concurrent connections and memory, not CPU per request) and means it cannot be restarted
  # without dropping connections - the clients reconnect, which is why the front end has backoff.
  realtime-service:
    build:
      context: ./backend
      dockerfile: realtime-service/Dockerfile
    image: slackclone/realtime-service:1.0.0
    container_name: slack-realtime
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      workspace-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      REALTIME_SERVICE_PORT: 8084
      # Origins allowed to open a WebSocket. The Vite dev server (5173) and the built front end
      # (3000). Never "*" - the browser does not apply same-origin to WebSocket the way it does
      # to fetch, so this list is what stops another site opening a socket as your user.
      # Same reasoning as the gateway's CORS list, and the same set of origins - a WebSocket
      # handshake from an unlisted origin is refused outright.
      REALTIME_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://host.docker.internal:3000
      TZ: ${TZ}
    ports:
      - "${REALTIME_SERVICE_PORT}:8084"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          # Higher than the stateless services. Each open WebSocket costs buffers and a session
          # entry, so memory here scales with connected users rather than with request rate.
          memory: 768M
    # Longer than the others, to match spring.lifecycle.timeout-per-shutdown-phase (45s).
    # Shutting down means closing every socket cleanly; cutting it short leaves clients waiting
    # on a dead connection until their heartbeat times out.
    stop_grace_period: 60s

  # --- api-gateway: the single public entry point ---
  #
  # In production this is the ONLY service with a published port; the rest stay inside the
  # cluster network. Here the others are published too, purely so their Swagger UIs are
  # reachable during development.
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    image: slackclone/api-gateway:1.0.0
    container_name: slack-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy    # the rate limiter needs it at startup
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
      message-service:
        condition: service_started
      realtime-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Service URLs use container names - "localhost" inside a container is the container.
      AUTH_SERVICE_URL: http://auth-service:8081
      WORKSPACE_SERVICE_URL: http://workspace-service:8082
      MESSAGE_SERVICE_URL: http://message-service:8083
      # ws://, not http://. Spring Cloud Gateway handles the Upgrade handshake, but only if the
      # route's scheme says WebSocket - with http:// the handshake 404s and says nothing useful.
      REALTIME_SERVICE_WS_URL: ws://realtime-service:8084
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      # The allowlist must contain every origin the app is actually SERVED from, not just the
      # ones you think of as "the front end".
      #
      # Spring's CORS filter rejects a request whose Origin is not listed with 403 "Invalid
      # CORS request" - and it does so even when the request is same-origin from the browser's
      # point of view, because Chrome sends an Origin header on non-GET requests regardless.
      # The browser then reports the 403 as a network failure, so the app shows "could not
      # reach the server" while the server is up and answering curl perfectly.
      #
      # host.docker.internal is here because the E2E suite runs in a container and reaches the
      # app through that hostname, making it the page origin for those runs.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://host.docker.internal:3000
      GATEWAY_PORT: 8080
      TZ: ${TZ}
    ports:
      - "${GATEWAY_PORT}:8080"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 30s

  # --- frontend: the React app, served by nginx ---
  #
  # nginx also proxies /api and /ws to the gateway, so the browser talks to a single origin.
  # That is why there is no CORS preflight in production and why the bundle contains no API
  # hostname - the same image runs in any environment.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: slackclone/frontend:1.0.0
    container_name: slack-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${FRONTEND_PORT}:80"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          # nginx serving static files needs very little. The number is low on purpose: if this
          # container ever needs more, something is wrong.
          memory: 128M

  # --- search-service (Python): indexes messages into OpenSearch and serves search ---
  search-service:
    build:
      context: ./python-services/search-service
      dockerfile: Dockerfile
    image: slackclone/search-service:1.0.0
    container_name: slack-search
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      workspace-service:
        condition: service_started
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_INDEX: messages
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      # A SHARED group id across replicas, unlike realtime-service's per-instance one. This
      # service builds durable state, so each event must be indexed once in total - a
      # per-instance group would index every message once per replica.
      KAFKA_GROUP_ID: search-service.indexer
      WORKSPACE_SERVICE_URL: http://workspace-service:8082
      # Must match the Java services exactly, or every token fails verification here while
      # working everywhere else.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      PORT: 8000
      TZ: ${TZ}
    ports:
      - "${SEARCH_SERVICE_PORT}:8000"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 384M
    stop_grace_period: 20s

  # --- notification-service (Python): events -> email -------------------------------
  # The second Python service. Python rather than Java because this is glue: read a topic,
  # decide whether a human should be told, render a template, talk SMTP. There is no domain
  # model here that a type system would protect.
  notification-service:
    build:
      context: ./python-services/notification-service
      dockerfile: Dockerfile
    image: slackclone/notification-service:1.0.0
    container_name: slack-notification
    restart: unless-stopped
    depends_on:
      # Postgres must be healthy, not merely started: this service applies its own schema at
      # startup and then writes to it on the first event it handles.
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Presence lookups, to avoid emailing someone who is looking at the app right now.
      redis:
        condition: service_healthy
      # Mailpit has no health check of its own (it is a dev tool), so service_started is all
      # that is available. A send that arrives before it is listening fails, the claim is
      # released, and the redelivery succeeds - which is the retry path working as designed.
      mailhog:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      # A SHARED group id across replicas. This service sends email - a side effect outside
      # itself - so each event must be handled once in TOTAL. A per-instance group here would
      # send one email per running container.
      KAFKA_GROUP_ID: notification-service.dispatcher
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # The compose service is still called `mailhog` for continuity; the image is Mailpit.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Slack Clone <no-reply@slack-clone.local>}
      # The address a RECIPIENT's browser can reach, which is not the one this container uses
      # to talk to the frontend. Links in email are opened by a person, not by this process.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      PORT: 8001
      TZ: ${TZ}
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8001"
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 256M
    stop_grace_period: 20s
