# Infrastructure only - databases, broker, search, object storage.
#
# Kept separate from docker-compose.apps.yml on purpose. Infra is slow to boot and
# almost never changes; app code changes constantly. Splitting them means restarting
# a service doesn't touch your local data.
#
#   docker compose up -d                                      # infra only
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d   # everything
#
# Reminder: inside these containers, other services are reachable by service name
# (postgres, redis, kafka). "localhost" means the container itself.

networks:
  slack-net:
    name: slack-net
    driver: bridge

# Named volumes so data survives `docker compose down`. Without these you'd re-seed
# the database on every restart.
volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:
  opensearch-data:
  seaweed-data:
  prometheus-data:
  grafana-data:

services:

  # --- Postgres: relational source of truth (users, workspaces, channels) ---
  postgres:
    # Pin the major version. `latest` will upgrade under you one day and break replication.
    image: postgres:16-alpine
    container_name: slack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"   # salted challenge-response; don't use trust or md5
      TZ: ${TZ}
      PGTZ: ${TZ}                                          # server stores and reports in UTC
    ports:
      # host:container - host side is 5433 because you already run Postgres on 5432
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Files here run once, alphabetically, on first boot of an empty volume.
      # To re-run them: docker compose down -v
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "Container started" is not "accepting connections" - Postgres needs a few
      # seconds. Services wait on this via depends_on: condition: service_healthy,
      # otherwise they crash-loop on startup.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 768M      # uncapped Postgres will eat the whole laptop

  # --- Mongo: message documents ---
  #
  # Standalone, not a replica set - which means no multi-document transactions. That is a
  # deliberate constraint the message-service design works within rather than around.
  #
  # The obvious reason to want transactions is that two operations touch two documents:
  # posting a thread reply (insert the reply, bump the parent's replyCount) and writing a
  # message (insert it, stage an outbox event). Both are solved without transactions instead:
  #
  #   - the outbox lives INSIDE the message document, as a pendingEvents array. Staging the
  #     event is part of the same single-document write as the message itself, and MongoDB
  #     guarantees single-document atomicity unconditionally. No transaction needed, and it
  #     cannot half-apply.
  #   - replyCount is a cache, updated best-effort and reconciled from the message.created
  #     event. A briefly stale reply count is worth far less than the operational cost below.
  #
  # Enabling transactions here would mean running a replica set WITH authentication, and those
  # two deadlock on first boot in this image: creating the root user needs a writable primary,
  # and rs.initiate() needs to authenticate. Getting out of that requires starting mongod
  # unauthenticated, initiating, creating users, then restarting with --auth and a keyFile
  # whose 400 permissions a Windows bind mount cannot represent. Real infrastructure work for
  # a guarantee the design does not need.
  mongo:
    image: mongo:7.0
    container_name: slack-mongo
    restart: unless-stopped
    environment:
      # The image only understands the MONGO_INITDB_* names; it creates this root user in
      # the admin database on first boot.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      # Our own names, read by infra/mongo/init/01-init.js to create the scoped app user.
      # These have to be passed explicitly - the init script runs inside the container and
      # sees only what's listed here, not the .env file.
      MONGO_APP_USER: ${MONGO_USER}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MONGO_HOST_PORT}:27017"      # 27018 on the host, same reason as Postgres
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # ping returning ok:1 means it's actually serving queries, not just running
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Redis: refresh tokens, presence, pub/sub fan-out, rate limit counters ---
  redis:
    image: redis:7.2-alpine
    container_name: slack-redis
    restart: unless-stopped
    # Default image has no password and no persistence, so override the command.
    # noeviction is deliberate: if Redis silently dropped keys under pressure we'd
    # randomly log people out (refresh tokens) and lose rate-limit counters. Better
    # to reject writes loudly and page someone.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 384M

  # --- Kafka (KRaft, no ZooKeeper) ---
  kafka:
    image: apache/kafka:3.8.0
    container_name: slack-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # single node plays both roles; prod splits them
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: slack-clone-kafka-cluster-1         # stable id so the log dir is recognised across restarts

      # Listeners are where most Kafka setups go wrong. A client connects to the
      # bootstrap address, then the broker tells it "actually reach me here" using the
      # advertised address. If that address isn't routable from the caller, the client
      # just hangs with no useful error. Two listeners because we have two kinds of
      # caller: containers (kafka:9092) and tools on the Windows host (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Internal topics default to RF=3, which a one-broker cluster can't satisfy -
      # the broker refuses to start. Dev only.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0       # skip the 3s first-rebalance wait
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # a typo'd topic name should fail, not quietly create a new topic
      KAFKA_LOG_RETENTION_HOURS: 168                  # a week, so a consumer down over the weekend can catch up
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${KAFKA_HOST_PORT}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 1G

  # --- One-shot topic creation (we disabled auto-create above) ---
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: slack-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"                 # init job: runs, exits 0, stays exited
    entrypoint: ["/bin/bash", "-c"]
    # 3 partitions lets up to 3 consumers in a group work in parallel. Kafka only
    # orders within a partition, and we key events by channelId, so everything for one
    # channel stays on one partition and stays ordered - which is the guarantee chat needs.
    # $$t escapes Compose's own variable syntax so the container shell sees $t.
    command:
      - |
        set -e
        for t in message.created message.updated message.deleted reaction.added channel.events user.events notification.dispatch; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks: [slack-net]

  # --- OpenSearch: message full-text search ---
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: slack-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true          # swapping the heap destroys search latency
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}"
      - DISABLE_SECURITY_PLUGIN=true        # dev only - no TLS, no auth. Never in prod.
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }       # needed for memory_lock to take effect
      nofile:  { soft: 65536, hard: 65536 } # Lucene holds thousands of segment files open
    ports:
      - "${OPENSEARCH_HOST_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # Accept yellow. A single-node cluster is always yellow because replicas have
      # nowhere to live - treating that as failure is a classic false alarm.
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 1200M

  # --- SeaweedFS: S3-compatible object storage for uploads ---
  # Everything in one process for dev (master + volume + filer + S3 gateway). Prod uses
  # real S3; our Java code is AWS SDK v2 either way, so only the endpoint differs.
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    container_name: slack-seaweedfs
    restart: unless-stopped
    # -s3.config turns on credential checking. Without it SeaweedFS accepts any
    # credentials, so presigned-URL signing would silently never be exercised.
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3-identities.json
      -master.volumeSizeLimitMB=1024
    ports:
      - "${S3_HOST_PORT}:8333"              # S3 API - also how the browser fetches uploads
      - "${S3_MASTER_PORT}:9333"            # admin UI
    volumes:
      - seaweed-data:/data
      - ./infra/seaweedfs/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside this container localhost resolves to ::1 and
      # SeaweedFS binds IPv4 only, so a localhost probe fails with "connection refused"
      # against a perfectly healthy server.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 512M

  # --- One-shot bucket creation ---
  # Uses the AWS CLI rather than a vendor tool, so this same command works unchanged
  # against real S3.
  s3-init:
    image: amazon/aws-cli:2.17.0
    container_name: slack-s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
    entrypoint: ["/bin/sh", "-c"]
    # `s3 mb` on an existing bucket exits non-zero, so swallow it - this has to be safe
    # to re-run.
    command:
      - |
        aws --endpoint-url ${S3_ENDPOINT} s3 mb s3://${S3_BUCKET} 2>/dev/null || echo "bucket already exists"
        aws --endpoint-url ${S3_ENDPOINT} s3 ls
    networks: [slack-net]

  # --- Mailpit: catches outgoing mail so nothing real gets sent from a laptop ---
  mailhog:
    image: axllent/mailpit:v1.20        # maintained successor to MailHog, same ports
    container_name: slack-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1    # no TLS in dev
    ports:
      - "${SMTP_PORT}:1025"             # SMTP
      - "${MAILHOG_UI_PORT}:8025"       # read the captured mail at http://localhost:8025
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Prometheus: metrics ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: slack-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days. Prometheus is for "what is happening now" and the last couple of weeks; it is
      # not a data warehouse, and its local TSDB is not designed to be one. Long-term history
      # belongs in remote write to something built for it (Thanos, Mimir, a managed service).
      - --storage.tsdb.retention.time=15d
      # Needed for POST /-/reload, so a scrape-config change can be applied without a restart -
      # a restart drops the in-memory head block and loses the most recent samples.
      - --web.enable-lifecycle
    volumes:
      # Read-only. A monitoring container has no business writing to its own configuration, and
      # :ro means a compromise of Prometheus cannot rewrite what it scrapes.
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      # Prometheus' own readiness endpoint, which is not the same as /-/healthy: healthy means
      # the process is alive, ready means the TSDB has finished loading and it can serve
      # queries. On a restart with a large head block those are minutes apart.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Grafana: dashboards ----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: slack-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Anonymous sign-up disabled. On by default in some distributions, and a dashboard that
      # exposes request volumes and error rates is a map of the system for anyone who finds it.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls. Grafana otherwise phones home for version checks and plugin
      # metadata, which on an air-gapped or slow network turns into a 30-second page load.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3001, because the frontend already has 3000.
      - "${GRAFANA_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [slack-net]
    deploy:
      resources:
        limits:
          memory: 384M
